<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#06060e">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>传讯</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Noto Serif SC',serif;background:#06060e;color:#e5e5e5;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative}
        .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
        .star{position:absolute;border-radius:50%;background:rgba(255,255,255,.7);animation:twinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
        @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
        .glow{position:fixed;border-radius:50%;filter:blur(80px);opacity:.08;pointer-events:none;z-index:0}
        .glow-1{width:300px;height:300px;background:#c5a47e;top:-80px;right:-60px}
        .glow-2{width:250px;height:250px;background:#7FA6CD;bottom:10%;left:-40px}
        .container{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:60px 24px 40px;min-height:100vh;min-height:100dvh}
        .header{text-align:center;margin-bottom:42px;animation:fadeDown .8s ease}
        .header-icon{font-size:20px;letter-spacing:6px;margin-bottom:14px;opacity:.5}
        .header h1{font-size:26px;font-weight:400;letter-spacing:8px;margin-bottom:10px;background:linear-gradient(135deg,#e5e5e5,#a0a0a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header .subtitle{font-size:12px;color:#5a5a5a;letter-spacing:3px;font-weight:300}
        .divider{width:40px;height:1px;background:linear-gradient(90deg,transparent,#444,transparent);margin:18px auto 0}
        @keyframes fadeDown{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:translateY(0)}}
        .role-list{display:flex;flex-direction:column;gap:12px}
        .role-card{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px 18px;cursor:pointer;transition:all .35s cubic-bezier(.25,.8,.25,1);text-decoration:none;color:inherit;animation:fadeUp .5s ease both;position:relative;overflow:hidden}
        .role-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.03) 0%,transparent 60%);opacity:0;transition:opacity .35s}
        .role-card:hover::before,.role-card:active::before{opacity:1}
        .role-card:active{transform:scale(.97);background:rgba(255,255,255,.07)}
        .role-card.empty{opacity:.35;border-style:dashed}
        .role-card.empty:active{transform:none;background:rgba(255,255,255,.04)}
        @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .role-card:nth-child(1){animation-delay:.05s}.role-card:nth-child(2){animation-delay:.1s}.role-card:nth-child(3){animation-delay:.15s}.role-card:nth-child(4){animation-delay:.2s}.role-card:nth-child(5){animation-delay:.25s}.role-card:nth-child(6){animation-delay:.3s}.role-card:nth-child(7){animation-delay:.35s}.role-card:nth-child(8){animation-delay:.4s}.role-card:nth-child(9){animation-delay:.45s}.role-card:nth-child(10){animation-delay:.5s}
        .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);overflow:hidden}
        .avatar img{width:100%;height:100%;object-fit:cover}
        .role-info{flex:1;min-width:0}
        .role-name{font-size:15px;font-weight:500;letter-spacing:1px;margin-bottom:3px}
        .role-desc{font-size:11px;color:#666;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .role-desc.ornament{letter-spacing:3px;opacity:.4}
        .edit-btn{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#555;font-size:12px;cursor:pointer;transition:all .25s;z-index:2}
        .edit-btn:active{background:rgba(255,255,255,.1);color:#aaa}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#4a9e6a;flex-shrink:0;box-shadow:0 0 6px rgba(74,158,106,.5);animation:pulse 2s ease-in-out infinite}
        .empty .status-dot{background:#333;box-shadow:none;animation:none}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .footer{text-align:center;margin-top:40px;padding-bottom:20px;animation:fadeUp .5s ease .6s both}
        .footer p{font-size:11px;color:#333;letter-spacing:2px}
        .cx-overlay{position:fixed;inset:0;background:rgba(6,6,14,.85);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;animation:oIn .2s ease}
        @keyframes oIn{from{opacity:0}to{opacity:1}}
        .cx-dialog{background:linear-gradient(145deg,rgba(30,30,42,.95),rgba(20,20,30,.98));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px 24px 22px;width:88%;max-width:320px;box-shadow:0 24px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);animation:dIn .3s cubic-bezier(.25,.8,.25,1)}
        @keyframes dIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .cx-dialog-title{font-size:14px;font-weight:400;letter-spacing:2px;text-align:center;color:#888;margin-bottom:20px}
        .cx-menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);color:#ccc;font-size:13px;font-weight:400;letter-spacing:.5px;font-family:'Noto Serif SC',serif;cursor:pointer;transition:all .2s;text-align:left}
        .cx-menu-item:active{background:rgba(255,255,255,.08)}
        .cx-menu-item .item-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(197,164,126,.1);color:#c5a47e;font-size:12px;flex-shrink:0}
        .cx-menu-item.danger{color:#665}
        .cx-menu-item.danger .item-icon{background:rgba(255,255,255,.03);color:#665}
        .cx-menu-item.cancel{justify-content:center;color:#555;background:none;border-color:transparent;margin-top:4px}
        .cx-menu-gap{height:8px}
        .cx-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 16px;font-size:14px;color:#e5e5e5;font-family:'Noto Serif SC',serif;outline:none;transition:border-color .2s;letter-spacing:.5px}
        .cx-input:focus{border-color:rgba(197,164,126,.3)}
        .cx-input::placeholder{color:#444}
        .cx-btn-row{display:flex;gap:10px;margin-top:18px}
        .cx-btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:13px;font-family:'Noto Serif SC',serif;cursor:pointer;transition:all .2s;letter-spacing:1px}
        .cx-btn-cancel{background:rgba(255,255,255,.04);color:#666}
        .cx-btn-save{background:rgba(197,164,126,.12);color:#c5a47e;border:1px solid rgba(197,164,126,.15)}
        .cx-btn-save:active{background:rgba(197,164,126,.25)}
        @supports(padding-bottom:env(safe-area-inset-bottom)){.container{padding-bottom:calc(40px + env(safe-area-inset-bottom))}}
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="container">
    <div class="header">
        <div class="header-icon">✦ ✦ ✦</div>
        <h1>传 讯</h1>
        <div class="subtitle">Your very voice is in my heartbeat.</div>
        <div class="divider"></div>
    </div>
    <div class="role-list" id="roleList"></div>
    <div class="footer"><p>✦ You're all my pleasure, my hope and my song ✦</p></div>
</div>
<input type="file" id="avatarFileInput" accept="image/*" style="display:none">
<script>
const RANDOM_DESCS=["在线","想你了","在等你","晚安","忙碌中","刚刚上线","在想你","今天也很想见你","方便聊聊吗","在发呆","刚醒","睡不着","有话想跟你说","等你很久了","今天天气真好","无聊中","嗯？你来了","一直在这里"];
const ROLES=[
    {slot:0,link:"https://lambnote.github.io/cx-main/"},
    {slot:1,link:"https://lambnote.github.io/cx-slot-2/"},
    {slot:2,link:"https://lambnote.github.io/cx-slot-3/"},
    {slot:3,link:"https://lambnote.github.io/cx-slot-4/"},
    {slot:4,link:"https://lambnote.github.io/cx-slot-5/"},
    {slot:5,link:"https://lambnote.github.io/cx-slot-6/"},
    {slot:6,link:"https://lambnote.github.io/cx-slot-7/"},
    {slot:7,link:"https://lambnote.github.io/cx-slot-8/"},
    {slot:8,link:"https://lambnote.github.io/cx-slot-9/"},
    {slot:9,link:"https://lambnote.github.io/cx-slot-10/"},
];
const DEFAULT_NAME='等待链接…';
const ORNAMENT='✦ ✧ ✦ ✧ ✦';
const SP='cx_nav_';
function gV(s,k){return localStorage.getItem(SP+k+'_'+s)}
function sV(s,k,v){localStorage.setItem(SP+k+'_'+s,v)}
function dV(s,k){localStorage.removeItem(SP+k+'_'+s)}
function rD(){return RANDOM_DESCS[Math.floor(Math.random()*RANDOM_DESCS.length)]}

const listEl=document.getElementById('roleList');
const afi=document.getElementById('avatarFileInput');
let curSlot=null;

function render(){
    listEl.innerHTML='';
    ROLES.forEach(r=>{
        const s=r.slot,cn=gV(s,'name'),cd=gV(s,'desc'),ca=gV(s,'avatar');
        const has=!!cn,dn=cn||DEFAULT_NAME;
        let dt,dc;
        if(cd){dt=cd;dc=''}
        else if(has){dt=rD();dc=''}
        else{dt=ORNAMENT;dc=' ornament'}

        const c=document.createElement('a');
        c.className='role-card'+(has?'':' empty');
        c.href=r.link;c.target='_blank';c.rel='noopener';c.dataset.slot=s;

        const av=ca?`<img src="${ca}" alt="${dn}">`:(has?dn.charAt(0):'✧');

        c.innerHTML=`<div class="avatar">${av}</div><div class="role-info"><div class="role-name">${dn}</div><div class="role-desc${dc}">${dt}</div></div><div class="edit-btn" data-slot="${s}">✎</div><div class="status-dot"></div>`;
        listEl.appendChild(c);
    });
    listEl.querySelectorAll('.edit-btn').forEach(b=>{
        b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showMenu(parseInt(b.dataset.slot))});
    });
}

function showMenu(s){
    const o=document.createElement('div');o.className='cx-overlay';
    const n=gV(s,'name')||DEFAULT_NAME;
    o.innerHTML=`<div class="cx-dialog"><div class="cx-dialog-title">✦ ${n} ✦</div><div style="display:flex;flex-direction:column;gap:8px"><button class="cx-menu-item" id="mA"><span class="item-icon">✦</span><span>更换头像</span></button><button class="cx-menu-item" id="mN"><span class="item-icon">✧</span><span>编辑角色名</span></button><button class="cx-menu-item" id="mD"><span class="item-icon">✦</span><span>编辑个性签名</span></button><div class="cx-menu-gap"></div><button class="cx-menu-item danger" id="mR"><span class="item-icon">✧</span><span>恢复默认</span></button><button class="cx-menu-item cancel" id="mC">取消</button></div></div>`;
    document.body.appendChild(o);
    o.addEventListener('click',e=>{if(e.target===o)o.remove()});
    document.getElementById('mC').addEventListener('click',()=>o.remove());
    document.getElementById('mA').addEventListener('click',()=>{o.remove();curSlot=s;afi.click()});
    document.getElementById('mN').addEventListener('click',()=>{o.remove();showInput(s,'name','编辑角色名',gV(s,'name')||'','输入角色名…')});
    document.getElementById('mD').addEventListener('click',()=>{o.remove();showInput(s,'desc','编辑个性签名',gV(s,'desc')||'','留空则随机显示…')});
    document.getElementById('mR').addEventListener('click',()=>{dV(s,'name');dV(s,'desc');dV(s,'avatar');o.remove();render()});
}

function showInput(s,k,t,cv,ph){
    const o=document.createElement('div');o.className='cx-overlay';
    o.innerHTML=`<div class="cx-dialog"><div class="cx-dialog-title">${t}</div><input type="text" class="cx-input" id="cxI" value="${cv.replace(/"/g,'&quot;')}" placeholder="${ph}" maxlength="20"><div class="cx-btn-row"><button class="cx-btn cx-btn-cancel" id="cxC">取消</button><button class="cx-btn cx-btn-save" id="cxS">保存</button></div></div>`;
    document.body.appendChild(o);
    const inp=document.getElementById('cxI');setTimeout(()=>inp.focus(),100);
    function cl(){o.remove()}
    o.addEventListener('click',e=>{if(e.target===o)cl()});
    document.getElementById('cxC').addEventListener('click',cl);
    document.getElementById('cxS').addEventListener('click',()=>{const v=inp.value.trim();if(v)sV(s,k,v);else dV(s,k);cl();render()});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('cxS').click()});
}

afi.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f||curSlot===null)return;
    const r=new FileReader();
    r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),sz=200;c.width=sz;c.height=sz;const ctx=c.getContext('2d'),m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,sz,sz);sV(curSlot,'avatar',c.toDataURL('image/jpeg',.8));curSlot=null;render()};img.src=ev.target.result};
    r.readAsDataURL(f);afi.value='';
});

render();

const starsEl=document.getElementById('stars');let sh='';
for(let i=0;i<80;i++){const x=(Math.random()*100).toFixed(1),y=(Math.random()*100).toFixed(1),sz=Math.random()>.7?2.5:1.5,dl=(Math.random()*5).toFixed(2),dr=(2+Math.random()*4).toFixed(1);sh+=`<div class="star" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;--delay:${dl}s;--dur:${dr}s"></div>`}
starsEl.innerHTML=sh;

if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
</script>
</body>
</html>
